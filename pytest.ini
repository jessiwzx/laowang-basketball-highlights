[pytest]
# --------------------------------------------------------------------------
# 临时目录策略
# --------------------------------------------------------------------------
# basetemp 由命令行显式给（`--basetemp`），ini 里只钉「保留策略」：
# 不按次数轮转删除旧目录。理由有两条，都与测试语义无关：
#   1) 按次数轮转会在一次会话里批量删除上百个临时目录，遇到对删除次数
#      有限制的受限环境会被直接掐断，表现为一堆 SystemExit 而非用例失败；
#   2) 保留旧目录对排查更有用，清理由 scripts/run_tests.py 收尾完成。
tmp_path_retention_count = 0
tmp_path_retention_policy = none

# 不写 .pytest_cache（少一处目录读写）
addopts = -p no:cacheprovider

# testpaths 固定为 tests，避免从仓库根直接跑时去收集 frontend/ 和 work/
# 测试收尾摘要断言（tests/write_guard.py）依赖 stderr 输出，别吞
testpaths = tests
